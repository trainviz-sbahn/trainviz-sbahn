<!DOCTYPE html>
<html lang="en" data-coreui-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#ffffff">
    <title>Marey Vis</title>
  <script type="module" crossorigin src="/assets/main-CNeu_5M3.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-OhHPr-yG.css">
</head>

<body>
    <div class="page">
        <div class="container-fluid page__container">
            <div class="row mt-2 align-items-center">
                <div class="col-3">
                    <select id= "O" class="form-control">
                        <option value="" selected disabled>Station</option>
                    </select>
                </div>
                <div class="col-3">
                    <select id="D" class="form-control">
                        <option value="" selected disabled>Station</option>
                    </select>
                </div>
                <div class="col-2">
                    <input id="date" type="date" class="form-control" min="2026-02-18" max="2026-06-19" value="2026-02-18">
                </div>
                <div class="col-2">
                    <input id="time" type="time" class="form-control" value="16:00">
                </div>
                <div class="col-1">
                    <select id="windowHours" class="form-control">
                        <option value="" selected disabled>Duration</option>
                        <option value="1">+1</option>
                        <option value="2">+2</option>
                        <option value="3">+3</option>
                        <option value="4">+4</option>
                        <option value="5">+5</option>
                        <option value="6">+6</option>
                    </select>
                </div>
                <div class="col-2">
                    <select id="avgWindow" class="form-control">
                        <option value="daily" selected>Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="biweekly">Bi-Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="3monthly">3 Monthly</option>
                    </select>
                </div>
                <div class="col-1">
                    <select id="direction" class="form-control">
                        <option value="ALL" selected>Both</option>
                        <option value="ONWARD">Onward</option>
                        <option value="RETURN">Return</option>
                    </select>
                </div>
                <div class="col-2">
                    <select id="comparisonView" class="form-control">
                        <option value="off" selected>Comparison: Off</option>
                        <option value="on">Comparison: On</option>
                    </select>
                </div>
                <div class="col-1">
                    <button id="search" class="btn btn-primary">Search</button>
                </div>
            </div>

            <div class="row mt-2 align-items-center">
                <div class="col-auto">
                    <div id="weekdays" class="btn-group btn-group-sm" role="group" aria-label="Day of week">
                        <button type="button" class="btn btn-outline-primary" data-day="0" aria-pressed="false">Su</button>
                        <button type="button" class="btn btn-outline-primary" data-day="1" aria-pressed="false">M</button>
                        <button type="button" class="btn btn-outline-primary" data-day="2" aria-pressed="false">Tu</button>
                        <button type="button" class="btn btn-outline-primary" data-day="3" aria-pressed="false">W</button>
                        <button type="button" class="btn btn-outline-primary" data-day="4" aria-pressed="false">Th</button>
                        <button type="button" class="btn btn-outline-primary" data-day="5" aria-pressed="false">F</button>
                        <button type="button" class="btn btn-outline-primary" data-day="6" aria-pressed="false">Sa</button>
                    </div>
                </div>
                <div class="col-auto">
                    <div id="corridorLegend" class="corridor-legend d-none" aria-label="Corridor legend">
                        <!-- Hatches are a vertical line rotated per tile so they tile
                             seamlessly: -45 = "\" (onward), 45 = "/" (return); tile
                             width sets density. -->
                        <svg width="0" height="0" class="position-absolute" aria-hidden="true">
                            <defs>
                                <pattern id="lgOnward" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                                    <line x1="0" y1="0" x2="0" y2="5" stroke="#fff" stroke-opacity="0.75" stroke-width="1.5" />
                                </pattern>
                                <pattern id="lgReturn" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                                    <line x1="0" y1="0" x2="0" y2="5" stroke="#fff" stroke-opacity="0.75" stroke-width="1.5" />
                                </pattern>
                                <pattern id="lgSparse" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                                    <line x1="0" y1="0" x2="0" y2="11" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5" />
                                </pattern>
                                <pattern id="lgDense" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                                    <line x1="0" y1="0" x2="0" y2="3.5" stroke="#fff" stroke-opacity="0.8" stroke-width="1.5" />
                                </pattern>
                            </defs>
                        </svg>

                        <span class="corridor-legend__item" title="A folded corridor's y-axis label: how many stations it groups, then the first one. Click it to unfold.">
                            <span class="corridor-legend__label">︾ (N)</span>
                            <span>no. of stations</span>
                        </span>

                        <!-- Average delay: the same continuous blend the corridor blocks
                             use - grey at on time, reaching full green/orange at 5 min. -->
                        <span class="corridor-legend__item" title="Average delay: full color at 5+ min early or late">
                            <span>early</span>
                            <span class="corridor-legend__scale"><span>on time</span></span>
                            <span>late</span>
                        </span>

                        <span class="corridor-legend__item">
                            <svg width="14" height="10" aria-hidden="true"><rect class="lg-bg" width="14" height="10" rx="2" fill="#3a4250" /><rect width="14" height="10" rx="2" fill="url(#lgOnward)" /></svg>
                            <span>onward</span>
                            <svg width="14" height="10" aria-hidden="true"><rect class="lg-bg" width="14" height="10" rx="2" fill="#3a4250" /><rect width="14" height="10" rx="2" fill="url(#lgReturn)" /></svg>
                            <span>return</span>
                        </span>

                        <span class="corridor-legend__item">
                            <svg width="14" height="10" aria-hidden="true"><rect class="lg-bg" width="14" height="10" rx="2" fill="#3a4250" /><rect width="14" height="10" rx="2" fill="url(#lgSparse)" /></svg>
                            <span>quiet</span>
                            <svg width="14" height="10" aria-hidden="true"><rect class="lg-bg" width="14" height="10" rx="2" fill="#3a4250" /><rect width="14" height="10" rx="2" fill="url(#lgDense)" /></svg>
                            <span>busy</span>
                        </span>
                    </div>
                </div>
                <!-- Comparison legend: after the corridor legend (if any), shown
                     while the comparison view is on. -->
                <div class="col-auto">
                    <div id="comparisonLegend" class="comparison-legend d-none" aria-label="Comparison legend">
                        <span class="comparison-legend__title">Comparison</span>
                        <!-- Delay scale: matches the comparison chart's x-axis, with the bold 0 line. -->
                        <span class="comparison-legend__item">
                            <span class="comparison-legend__tick">◂ early</span>
                            <svg width="56" height="12" aria-hidden="true">
                                <line x1="0" y1="6" x2="56" y2="6" stroke="#5b6472" stroke-width="1" />
                                <line x1="28" y1="0" x2="28" y2="12" stroke="#ffffff" stroke-width="1.5" />
                            </svg>
                            <span class="comparison-legend__tick">late ▸</span>
                            <span class="comparison-legend__unit">min · 0 = on time</span>
                        </span>

                        <span class="comparison-legend__item d-none" data-mode="primary">
                            <svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="#ffffff" stroke-width="3" /></svg>
                            <span>selected</span>
                            <svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="#a2c0ed" stroke-width="1.5" stroke-opacity="0.85" /></svg>
                            <span>same route</span>
                        </span>

                        <span class="comparison-legend__item d-none" data-mode="recency">
                            <svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="#a2c0ed" stroke-width="1.5" stroke-opacity="0.45" /></svg>
                            <span>earlier pick</span>
                            <svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="#ffffff" stroke-width="3" /></svg>
                            <span>latest pick</span>
                        </span>

                        <span class="comparison-legend__item d-none" data-mode="all">
                            <svg width="18" height="8" aria-hidden="true"><line x1="0" y1="4" x2="18" y2="4" stroke="#a2c0ed" stroke-width="1.5" stroke-opacity="0.85" /></svg>
                            <span>trip</span>
                        </span>
                    </div>
                </div>
                <div class="col-auto">
                    <span id="weekdayHint" class="text-muted small"></span>
                </div>
            </div>

            <!-- Comparison title/hint sit above BOTH charts (not inside the
                 comparison panel) so the two chart areas start and end at the same
                 height and their station rows line up. -->
            <div class="row mt-2 d-none" id="comparisonInfoRow">
                <div class="col-4 offset-8 comparison-info">
                        <span class="comparison-info__title">Comparison</span>
                        <div id="comparisonHint" class="text-muted">Click a trip line in the Marey chart to see its delay curve.</div>
                </div>
            </div>

            <div class="row mt-2 chart-row">
                <div class="col-12" id="chartCol">
                    <div id="chartLoading" class="chart-loading d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div id="chartEmpty" class="chart-empty d-none" role="status">
                        <div class="chart-empty__title">No data</div>
                        <div id="chartEmptyDetail" class="chart-empty__detail"></div>
                    </div>
                    <div id="chart"></div>
                </div>
                <div class="col-4 d-none" id="comparisonCol">
                    <div id="comparisonPanel" class="comparison-panel">
                        <div id="comparisonChart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
